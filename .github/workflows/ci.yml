name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Restore locked dependencies
        shell: pwsh
        run: |
          dotnet restore .\src\TuckPane\TuckPane.csproj --locked-mode -p:Platform=x64
          dotnet restore .\src\TuckPane.Updater\TuckPane.Updater.csproj --locked-mode
          dotnet restore .\src\TuckPane.Launcher\TuckPane.Launcher.csproj --locked-mode
          dotnet restore .\src\TuckPane.Updates\TuckPane.Updates.csproj --locked-mode

      - name: Build solution
        shell: pwsh
        run: dotnet build .\TuckPane.slnx -c Release

      # Mirrors the publish + launcher packaging flow used by scripts/build-release.ps1.
      - name: Publish application and portable launcher
        shell: pwsh
        run: |
          dotnet publish .\src\TuckPane\TuckPane.csproj `
            -c Release `
            --no-restore `
            -p:Platform=x64 `
            -p:RuntimeIdentifier=win-x64 `
            -p:SelfContained=true `
            -p:WindowsAppSDKSelfContained=true `
            -p:DebugSymbols=false `
            -p:DebugType=None `
            -o .\artifacts\ci\app
          if ($LASTEXITCODE -ne 0) { throw "Application publish failed" }
          .\scripts\publish-portable-launcher.ps1 -PublishDirectory .\artifacts\ci\app
          $files = [ordered]@{}
          Get-ChildItem -LiteralPath .\artifacts\ci\app -File -Recurse | Sort-Object FullName | ForEach-Object {
            $relative = [IO.Path]::GetRelativePath((Resolve-Path .\artifacts\ci\app).Path, $_.FullName).Replace('\', '/')
            $files[$relative] = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          }
          $props = [xml](Get-Content -LiteralPath .\Directory.Build.props -Raw)
          $version = ($props.Project.PropertyGroup.Version | Select-Object -First 1).'#text'.Trim()
          @{ Version = $version; Files = $files } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath .\artifacts\ci\app\update-files.json -Encoding utf8

      - name: Portable launcher checks
        shell: pwsh
        run: .\scripts\check-portable-launcher.ps1 -PublishDirectory (Resolve-Path -LiteralPath .\artifacts\ci\app).Path

      - name: Update checks
        shell: pwsh
        run: dotnet run --project .\tests\TuckPane.UpdateChecks\TuckPane.UpdateChecks.csproj -c Release -- --updates

      - name: Headless logic checks
        shell: pwsh
        run: |
          dotnet build .\tests\TuckPane.LogicChecks\TuckPane.LogicChecks.csproj -c Release -p:Platform=x64 -p:WindowsAppSdkBootstrapInitialize=false
          if ($LASTEXITCODE -ne 0) { throw "LogicChecks build failed" }
          & .\tests\TuckPane.LogicChecks\bin\x64\Release\net10.0-windows10.0.22621.0\win-x64\TuckPane.LogicChecks.exe --ci-headless
          if ($LASTEXITCODE -ne 0) { throw "Headless logic checks failed with exit code $LASTEXITCODE" }

      - name: Note editor JS checks
        shell: pwsh
        run: |
          foreach ($script in 'note-blank-lines-check.cjs', 'note-cut-history-check.cjs', 'note-image-commands-check.cjs') {
            node ".\tests\$script"
            if ($LASTEXITCODE -ne 0) { throw "Node check '$script' failed with exit code $LASTEXITCODE" }
          }
