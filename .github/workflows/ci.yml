name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      # Mirrors the restore/publish arguments used by scripts/build-release.ps1, so a pull request
      # fails here instead of failing halfway through a tagged release build.
      - name: Restore
        shell: pwsh
        run: dotnet restore .\src\TuckPane\TuckPane.csproj --locked-mode -p:Platform=x64

      - name: Build application
        shell: pwsh
        run: |
          dotnet publish .\src\TuckPane\TuckPane.csproj `
            -c Release `
            --no-restore `
            -p:Platform=x64 `
            -p:RuntimeIdentifier=win-x64 `
            -p:SelfContained=true `
            -p:WindowsAppSDKSelfContained=true `
            -p:DebugSymbols=false `
            -p:DebugType=None `
            -o .\artifacts\ci\app

      - name: Build update helper and launcher
        shell: pwsh
        run: |
          dotnet build .\src\TuckPane.Updater\TuckPane.Updater.csproj -c Release
          dotnet build .\src\TuckPane.Launcher\TuckPane.Launcher.csproj -c Release

      - name: Update checks
        shell: pwsh
        run: dotnet run --project .\tests\TuckPane.UpdateChecks\TuckPane.UpdateChecks.csproj -c Release -- --updates

      # The logic checks are deliberately absent. The suite builds here in about a minute, but the
      # test executable never reaches its entry point on a hosted runner: given ninety seconds each,
      # all eight stability areas plus the folder-menu suite were killed without printing a line,
      # and the same commands finish in about a second on a desktop session. Its startup goes
      # through the Windows App Runtime bootstrap, which needs an interactive session.
      # Run them locally before a release:
      #   dotnet run --project .\tests\TuckPane.LogicChecks\TuckPane.LogicChecks.csproj -c Release -p:Platform=x64 -- --stability storage
      #   dotnet run --project .\tests\TuckPane.LogicChecks\TuckPane.LogicChecks.csproj -c Release -p:Platform=x64 -- --folder-context-menu
