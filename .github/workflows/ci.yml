name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.400

      # Mirrors the restore/publish arguments used by scripts/build-release.ps1, so a pull request
      # fails here instead of failing halfway through a tagged release build.
      - name: Restore
        shell: pwsh
        run: dotnet restore .\src\TuckPane\TuckPane.csproj --locked-mode -p:Platform=x64

      - name: Build application
        shell: pwsh
        run: |
          dotnet publish .\src\TuckPane\TuckPane.csproj `
            -c Release `
            --no-restore `
            -p:Platform=x64 `
            -p:RuntimeIdentifier=win-x64 `
            -p:SelfContained=true `
            -p:WindowsAppSDKSelfContained=true `
            -p:DebugSymbols=false `
            -p:DebugType=None `
            -o .\artifacts\ci\app

      - name: Build update helper and launcher
        shell: pwsh
        run: |
          dotnet build .\src\TuckPane.Updater\TuckPane.Updater.csproj -c Release
          dotnet build .\src\TuckPane.Launcher\TuckPane.Launcher.csproj -c Release

      - name: Update checks
        shell: pwsh
        run: dotnet run --project .\tests\TuckPane.UpdateChecks\TuckPane.UpdateChecks.csproj -c Release -- --updates

      # Only the named suites are run here. The parameterless entry point replays the legacy
      # interactive checks, which expect a desktop session and never return on a hosted runner.
      # The stability areas and the folder-menu suite build no window, start no OLE, drive no input
      # and leave the registry alone, so they are safe to run unattended.
      - name: Logic checks
        shell: pwsh
        env:
          TUCKPANE_TEST_ROOT: ${{ runner.temp }}\tuckpane-ci
        run: |
          dotnet build .\tests\TuckPane.LogicChecks\TuckPane.LogicChecks.csproj -c Release -p:Platform=x64
          $areas = 'storage', 'queue', 'lifecycle', 'drop', 'launch', 'watcher', 'diagnostics', 'diagnostics-limits'
          foreach ($area in $areas) {
            dotnet run --project .\tests\TuckPane.LogicChecks\TuckPane.LogicChecks.csproj -c Release -p:Platform=x64 --no-build -- --stability $area
            if ($LASTEXITCODE -ne 0) { throw "stability check '$area' failed with exit code $LASTEXITCODE" }
          }
          dotnet run --project .\tests\TuckPane.LogicChecks\TuckPane.LogicChecks.csproj -c Release -p:Platform=x64 --no-build -- --folder-context-menu
          if ($LASTEXITCODE -ne 0) { throw "folder-context-menu check failed with exit code $LASTEXITCODE" }
